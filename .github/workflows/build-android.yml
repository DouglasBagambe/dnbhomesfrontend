name: Build Homes Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.38.1", channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build unsigned production AAB
        env:
          HOMES_API_URL: ${{ secrets.HOMES_API_URL }}
        run: flutter build appbundle --release --flavor production --dart-define=HOMES_ENV=production --dart-define=HOMES_API_URL="$HOMES_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: homes-production-aab
          path: build/app/outputs/bundle/productionRelease/app-production-release.aab
