name: Final format account pass
on:
  push:
    branches: [final/consumer-account-perfection]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final/consumer-account-perfection
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/core/network/api_client.dart lib/features/accounts/account_screen.dart lib/features/accounts/consumer_controller.dart lib/features/accounts/social_auth.dart lib/features/bookings/presentation/viewing_request_screen.dart
      - run: rm .github/workflows/format-account-pass.yml
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(accounts): apply canonical Dart formatting"
          git push origin HEAD:final/consumer-account-perfection
